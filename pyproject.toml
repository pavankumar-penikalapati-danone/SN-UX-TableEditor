[project]
name = "sn-ux-db-table-editor"
version = "0.1.0"
description = "A DB App to view and edit DB catalog tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk~=0.33.0",
    "databricks-sql-connector~=3.4.0",
    "pandas~=2.2.3",
    "plotly>=6.5.2",
    "python-dotenv>=1.2.1",
    "seaborn>=0.13.2",
    "streamlit~=1.50.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pip>=26.0.1",
    "databricks-connect>=15.1.3"
]
